{% macro chips_row(chips) -%}
<div class="chips" role="group" aria-label="Quick remarks">
  {% for chip in chips %}
  <button type="button" class="chip" data-text="{{ chip }}">{{ chip }}</button>
  {% endfor %}
</div>
{%- endmacro %}

{% macro yn_toggle(field, label, value) -%}
<div class="field">
  <span class="field-label">{{ label }}</span>
  <div class="yn" data-field="{{ field }}">
    <input type="hidden" name="{{ field }}" value="{{ '1' if value else '0' }}">
    <button type="button" class="yn-btn" data-val="1" aria-label="{{ label }}: yes">Y</button>
    <button type="button" class="yn-btn" data-val="0" aria-label="{{ label }}: no">N</button>
  </div>
</div>
{%- endmacro %}
