<div class="theme-switch" role="group" aria-label="Colour theme">
  <button type="button" data-theme-choice="light" title="Light" aria-label="Light theme"><svg class="ico"><use href="#i-sun"/></svg></button>
  <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark theme"><svg class="ico"><use href="#i-moon"/></svg></button>
  <button type="button" data-theme-choice="system" title="Match my system" aria-label="Match system theme"><svg class="ico"><use href="#i-monitor"/></svg></button>
</div>
