<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  /* Theme: "light", "dark" or "system" (default), remembered per browser.
     Runs before the stylesheet so the page never flashes the wrong colours. */
  (function () {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    function choice() {
      try { return localStorage.getItem("se-theme") || "system"; } catch (e) { return "system"; }
    }
    window.applyTheme = function () {
      var c = choice();
      var dark = c === "dark" || (c === "system" && media.matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.themeChoice = c;
      document.dispatchEvent(new Event("themechange"));
    };
    window.applyTheme();
    if (media.addEventListener) media.addEventListener("change", function () {
      if (choice() === "system") window.applyTheme();
    });
  })();
</script>
