{% extends "base.html" %}
{% block title %}Settings — SE-Tracker{% endblock %}
{% block content %}
<header class="page-head"><div class="page-head-main"><h1 class="page-title">Settings</h1></div></header>
<form method="post" class="settings-form card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Cohort label
    <input name="cohort_label" value="{{ cohort }}" required>
  </label>
  <p class="muted small-text">Used in export filenames, e.g. <code>{{ cohort }}-Team-096.xlsx</code>.</p>
  <label>Your name
    <input name="ta_name" value="{{ g.ta.name }}" required>
  </label>
  <label>New password <span class="muted">(leave blank to keep current)</span>
    <input name="new_password" type="password" minlength="6" autocomplete="new-password">
  </label>
  <p class="muted small-text">Signed in as <code>{{ g.ta.email }}</code>.</p>
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
