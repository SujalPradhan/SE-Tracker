{% extends "auth_base.html" %}
{% block title %}Create account — SE-Tracker{% endblock %}
{% block card %}
<h1>Create your TA account</h1>
<form method="post" class="auth-form">
  <label>Name
    <input name="name" value="{{ request.form.get('name', '') }}" required autofocus>
  </label>
  <label>Email
    <input name="email" type="email" value="{{ request.form.get('email', '') }}"
           required autocomplete="username">
  </label>
  <label>Password <span class="muted">(6+ characters)</span>
    <input name="password" type="password" required minlength="6" autocomplete="new-password">
  </label>
  <button type="submit" class="btn btn-primary">Create account</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('main.login') }}">Sign in</a></p>
{% endblock %}
