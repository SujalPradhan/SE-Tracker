{% extends "auth_base.html" %}
{% block title %}Create account — SE-Tracker{% endblock %}
{% block card %}
<h1>Create a TA account</h1>
<p class="muted auth-sub">Your teams are only visible to you.</p>
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Name
    <input name="name" value="{{ name or '' }}" required maxlength="120" autocomplete="name"
           {% if not name %}autofocus{% endif %}>
  </label>
  <label>Email
    <input name="email" type="email" value="{{ email or '' }}" required maxlength="254"
           autocomplete="username" placeholder="you@study.iitm.ac.in">
  </label>
  <label>Password <span class="muted">(at least 6 characters)</span>
    <input name="password" type="password" required minlength="6" maxlength="256"
           autocomplete="new-password" {% if name %}autofocus{% endif %}>
  </label>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<p class="muted auth-switch">Already have one? <a href="{{ url_for('main.login') }}">Sign in</a></p>
{% endblock %}
