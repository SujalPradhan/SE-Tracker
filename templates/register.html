{% extends "auth_base.html" %}
{% block title %}Create account — SE-Tracker{% endblock %}
{% block card %}
<h1>Create a TA account</h1>
<p class="muted auth-sub">Your teams are only visible to you.</p>
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Name
    <input name="name" value="{{ request.form.get('name', '') }}" required autofocus>
  </label>
  <label>Email
    <input name="email" type="email" value="{{ request.form.get('email', '') }}"
           required autocomplete="username" placeholder="you@study.iitm.ac.in">
  </label>
  <label>Password <span class="muted">(at least 6 characters)</span>
    <input name="password" type="password" required minlength="6" autocomplete="new-password">
  </label>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<p class="muted auth-switch">Already have one? <a href="{{ url_for('main.login') }}">Sign in</a></p>
{% endblock %}
